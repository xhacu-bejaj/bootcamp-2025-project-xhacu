[project]
name = "prompted-doc-processor"
version = "0.1.0"
description = "GenAI Bootcamp Project"
dependencies = [
    "fastapi~=0.115",
    "uvicorn~=0.30",
    "pydantic~=2.9",
    "pydantic-settings~=2.4"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "unit: Fast unit tests with mocking (default)",
    "integration: Tests with real dependencies (MongoDB, ChromaDB)",
    "e2e: End-to-end workflow tests",
    "slow: Tests that take >1 second",
]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
