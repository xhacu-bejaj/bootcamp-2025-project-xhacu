services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bootcamp-app
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FILE_SNAPSHOT=${FILE_SNAPSHOT:-false}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-./var/chroma_db}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-chunks}
      - MAX_CHUNK_LENGTH=${MAX_CHUNK_LENGTH:-1000}
    volumes:
      - ./var:/app/var
      - ./activity.log:/app/activity.log
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - bootcamp-network

  mongodb:
    image: mongo:7.0
    container_name: bootcamp-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=data
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - bootcamp-network

  seeder:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bootcamp-seeder
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FILE_SNAPSHOT=${FILE_SNAPSHOT:-false}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-./var/chroma_db}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-chunks}
      - MAX_CHUNK_LENGTH=${MAX_CHUNK_LENGTH:-1000}
    volumes:
      - ./var:/app/var
      - ./data.raw.json:/app/data.raw.json # Mount the dataset
      - ./scripts:/app/scripts # Mount the scripts folder
    depends_on:
      - mongodb
      - app # Depends on app to ensure all stores are ready
    command: ["python", "scripts/load_dataset.py"]
    restart: "no" # Ensure it runs once and exits
    networks:
      - bootcamp-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  bootcamp-network:
    driver: bridge
